<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Website</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');


* {
    box-sizing: border-box;
}


body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #050505;
    color: white;
    overflow-x: hidden;
}


/* Leuchtender Hintergrund */

body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: #7c00ff;
    filter: blur(180px);
    top: -100px;
    left: -100px;
    opacity: 0.5;
    z-index: -1;
}


body::after {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: #00eaff;
    filter: blur(180px);
    bottom: -100px;
    right: -100px;
    opacity: 0.4;
    z-index: -1;
}



header {

    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);

    width: 90%;
    max-width: 1000px;

    padding: 20px 35px;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;

}



.logo {

    font-size:25px;
    font-weight:800;

    background: linear-gradient(90deg,#00eaff,#9d00ff);

    -webkit-background-clip:text;
    color:transparent;

}



nav a {

    color:white;
    text-decoration:none;
    margin-left:25px;

    transition:.3s;

}


nav a:hover {

    color:#00eaff;
    text-shadow:0 0 15px #00eaff;

}



.hero {

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

}



.hero h1 {

    font-size:80px;
    margin:0;

    background:linear-gradient(90deg,#00eaff,#9d00ff);

    -webkit-background-clip:text;
    color:transparent;

    animation: glow 3s infinite alternate;

}



.hero p {

    font-size:22px;
    color:#ccc;

}



@keyframes glow {

from {
text-shadow:0 0 20px #00eaff;
}

to {
text-shadow:0 0 60px #9d00ff;
}

}



.button {

display:inline-block;

margin-top:30px;

padding:16px 45px;

border-radius:50px;

background:white;

color:black;

font-weight:600;

text-decoration:none;

transition:.3s;

}



.button:hover {

transform:scale(1.1);

box-shadow:0 0 40px white;

}




section {

max-width:1100px;

margin:auto;

padding:100px 25px;

}



.card {

background:rgba(255,255,255,0.08);

border:1px solid rgba(255,255,255,0.15);

backdrop-filter:blur(20px);

padding:40px;

border-radius:30px;

box-shadow:0 0 40px rgba(0,234,255,.15);

transition:.4s;

}



.card:hover {

transform:translateY(-10px);

box-shadow:
0 0 30px #00eaff,
0 0 60px #9d00ff;

}



h2 {

font-size:40px;

}




footer {

text-align:center;

padding:40px;

color:#888;

}



</style>


</head>



<body>



<header>

<div class="logo">
DEINE MARKE
</div>


<nav>

<a href="#about">Über uns</a>

<a href="#contact">Kontakt</a>

<a href="#impressum">Impressum</a>

</nav>


</header>




<div class="hero">


<div>

<h1>
Willkommen
</h1>


<p>
Eine moderne Website mit Premium Design.
</p>


<a class="button" href="#contact">
Kontakt
</a>


</div>


</div>





<section id="about">

<div class="card">

<h2>Über uns</h2>

<p>

</p>

</div>

</section>





<section id="contact">

<div class="card">

<h2>Kontakt</h2>

<p>

</p>

<p>

</p>


</div>

</section>





<section id="impressum">

<div class="card">

<h2>Impressum</h2>

</p>

</div>

</section>

</body>
</html>
